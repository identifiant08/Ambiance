name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compiler l'APK
        run: gradle assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Ambiance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ambiance
          path: Ambiance.apk

      # Release : lien de téléchargement fixe, pratique à taper dans l'appli Downloader sur la TV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ambiance build ${{ github.run_number }}
          files: Ambiance.apk
          make_latest: true
