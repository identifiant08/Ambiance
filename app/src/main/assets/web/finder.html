<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambiance</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1524;--deep:#16223a;--moon:#ece6d6;--moon-dim:rgba(236,230,214,.64);--moon-faint:rgba(236,230,214,.12);--ember:#f2a65a;--serif:'Young Serif',Georgia,serif;--sans:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--ink);color:var(--moon);font-family:var(--sans)}
body{padding:calc(env(safe-area-inset-top) + 28px) 20px 32px;max-width:520px;margin:0 auto}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
.hero{position:relative;height:190px;border-radius:24px;overflow:hidden}
.hero .scene{width:100%;height:100%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(13,21,36,.9),rgba(13,21,36,0) 70%)}
.hero h1{position:absolute;left:18px;bottom:16px;font-family:var(--serif);font-weight:400;font-size:28px}
.lead{margin-top:20px;color:var(--moon-dim);line-height:1.5}
.scan{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--moon-dim);font-size:14px}
.scan i{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{opacity:.2}}
.tvs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tv{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:16px;background:var(--moon-faint);text-align:left}
.tv b{font-weight:700}.tv span{color:var(--moon-dim);font-size:13px}
.tv:active{transform:scale(.98)}
details{margin-top:26px;color:var(--moon-dim)}
summary{cursor:pointer;font-size:14px}
.field{display:flex;gap:8px;margin-top:10px}
.field input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:0;background:rgba(236,230,214,.08);font-size:16px}
.go{padding:0 18px;border-radius:14px;background:var(--moon);color:var(--ink);font-weight:700}
.local{display:block;width:100%;margin-top:28px;padding:15px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--moon-faint);color:var(--moon-dim)}
</style>
</head>
<body>
  <div class="hero alive"><div id="art" style="width:100%;height:100%"></div><div class="shade"></div><h1>Ambiance</h1></div>
  <p class="lead">Ton téléphone devient la télécommande. Ouvre Ambiance sur le Mi Box, reste sur le même Wi-Fi, la TV apparaît ici.</p>
  <div class="scan" id="scan"><i></i><span>Recherche des TV sur le réseau</span></div>
  <div class="tvs" id="tvs"></div>
  <details>
    <summary>La TV n'apparaît pas ?</summary>
    <p style="margin-top:10px;font-size:14px;line-height:1.5">Saisis l'adresse affichée en haut de l'accueil sur la TV.</p>
    <form class="field" id="manual"><input id="addr" inputmode="url" placeholder="192.168.1.20:8765" autocapitalize="off"><button class="go">Connecter</button></form>
  </details>
  <button class="local" id="local">Lire les ambiances sur ce téléphone</button>
<script src="moods.js"></script>
<script>
  const F = window.Finder;
  document.getElementById('art').innerHTML = Ambiance.sceneSVG('aurores');
  function draw() {
    let list = [];
    try { list = JSON.parse(F ? F.list() : '[]'); } catch (e) {}
    document.getElementById('tvs').innerHTML = list.map((t) =>
      `<button class="tv" data-h="${t.host}" data-p="${t.port}"><b>${t.name.replace(/[<>&]/g, '')}</b><span>${t.host}</span></button>`).join('');
    document.querySelectorAll('.tv').forEach((b) => b.onclick = () => F && F.connect(b.dataset.h, +b.dataset.p));
  }
  setInterval(draw, 1000); draw();
  document.getElementById('manual').onsubmit = (e) => {
    e.preventDefault();
    const v = document.getElementById('addr').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (!v) return;
    const [h, p] = v.split(':');
    F && F.connect(h, +(p || 8765));
  };
  document.getElementById('local').onclick = () => F && F.openPlayer();
</script>
</body>
</html>
